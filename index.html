<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMed - Hands-Free AI Health Assistant</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 15px; }
        
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 22px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
        .user-tag { background: rgba(56, 189, 248, 0.15); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 12px; border-radius: 20px; font-size: 12px; }

        /* Login Screen */
        .login-box { width: 100%; max-width: 400px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 25px; border-radius: 20px; text-align: center; margin-top: 30px; }
        .role-btn { width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px; border: none; font-size: 16px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: 0.3s; }
        .patient-btn { background: #0284c7; color: white; }
        .caregiver-btn { background: #0d9488; color: white; }

        /* Main Dashboard */
        .app-container { width: 100%; max-width: 450px; display: none; flex-direction: column; align-items: center; margin-top: 15px; }

        /* Live Camera View */
        .camera-box { width: 100%; height: 260px; background: #000; border-radius: 20px; border: 2px solid #38bdf8; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; border: 2px dashed #38bdf8; width: 80%; height: 70%; border-radius: 12px; pointer-events: none; }

        /* Voice AI Visualizer Ring */
        .voice-ring { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #38bdf8); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); margin: 15px 0; cursor: pointer; animation: pulse 1.8s infinite; }
        .voice-ring i { font-size: 30px; color: white; }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0.7); }
            70% { box-shadow: 0 0 0 20px rgba(56, 189, 248, 0); }
            100% { box-shadow: 0 0 0 0 rgba(56, 189, 248, 0); }
        }

        .ai-status { font-size: 14px; color: #38bdf8; margin-bottom: 10px; font-weight: 500; text-align: center; }
        .response-box { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 15px; width: 100%; min-height: 90px; text-align: center; font-size: 15px; color: #f1f5f9; line-height: 1.5; margin-bottom: 15px; }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .btn-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 12px; color: white; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; }
        .btn-card i { font-size: 18px; display: block; margin-bottom: 5px; color: #38bdf8; }
        .btn-card.sos { border-color: rgba(239, 68, 68, 0.5); }
        .btn-card.sos i { color: #ef4444; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-notes-medical"></i> VoiceMed</div>
        <div class="user-tag" id="userRoleTag">Role: Not Logged In</div>
    </div>

    <!-- Login Screen -->
    <div class="login-box" id="loginScreen">
        <h2>Voice Login</h2>
        <p style="color: #94a3b8; font-size: 14px; margin: 10px 0 20px;">Say <b>"Patient"</b> or <b>"Caregiver"</b> to login hands-free!</p>
        <button class="role-btn patient-btn" onclick="selectRole('Patient')"><i class="fa-solid fa-user-injured"></i> Login as Patient</button>
        <button class="role-btn caregiver-btn" onclick="selectRole('Caregiver')"><i class="fa-solid fa-user-nurse"></i> Login as Caregiver</button>
    </div>

    <!-- Main Dashboard Screen -->
    <div class="app-container" id="appDashboard">
        
        <!-- Live Video Viewfinder -->
        <div class="camera-box">
            <video id="webcam" autoplay playsinline></video>
            <div class="scan-overlay"></div>
        </div>

        <div class="ai-status" id="aiStatus">Listening for Voice Commands...</div>

        <!-- Animated Siri Style Voice Assistant -->
        <div class="voice-ring" onclick="listenCommand()">
            <i class="fa-solid fa-microphone"></i>
        </div>

        <div class="response-box" id="responseBox">
            Camera active! Say "Scan" to read medicine strip or speak in Tamil/English.
        </div>

        <div class="action-grid">
            <div class="btn-card" onclick="scanMedicine()"><i class="fa-solid fa-camera"></i> Scan Strip</div>
            <div class="btn-card" onclick="toggleRole()"><i class="fa-solid fa-users"></i> Switch Role</div>
            <div class="btn-card sos" onclick="triggerSOS()"><i class="fa-solid fa-bell"></i> SOS Caregiver</div>
            <div class="btn-card" onclick="listenCommand()"><i class="fa-solid fa-microphone-slash"></i> Tap to Speak</div>
        </div>
    </div>

    <script>
        let currentRole = "";
        let currentLang = "en-US";
        const video = document.getElementById('webcam');

        // Speech Recognition setup
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.continuous = true;
            recognition.interimResults = false;
        }

        window.onload = () => {
            speak("Welcome to VoiceMed. Say Patient or Caregiver to login.", 'en-US');
            startVoiceLogin();
        };

        function speak(text, lang = currentLang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.95;
                document.getElementById('responseBox').innerText = text;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Automatic Language Switcher based on Speech Text
        function isTamilText(text) {
            const tamilPattern = /[\u0B80-\u0BFF]/;
            return tamilPattern.test(text) || text.includes('vanakkam') || text.includes('epdi') || text.includes('tamil') || text.includes('marundhu');
        }

        // Voice Login Logic
        function startVoiceLogin() {
            if (!recognition) return;
            recognition.lang = 'en-US';
            recognition.onresult = (e) => {
                const speech = e.results[e.results.length - 1][0].transcript.toLowerCase();
                if (speech.includes('patient')) {
                    selectRole('Patient');
                } else if (speech.includes('caregiver')) {
                    selectRole('Caregiver');
                }
            };
            try { recognition.start(); } catch(e){}
        }

        function selectRole(role) {
            currentRole = role;
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('appDashboard').style.display = 'flex';
            document.getElementById('userRoleTag').innerText = "Role: " + role;

            let msg = role === 'Patient' ? 
                "Logged in as Patient. Camera is active. Say scan to analyze medicine." : 
                "Logged in as Caregiver. Monitoring patient medicine alerts.";
            
            speak(msg);
            initCamera();
            startContinuousListening();
        }

        // Camera Live View Execution (Prevents opening Gallery)
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: { exact: "environment" } } 
                }).catch(() => {
                    return navigator.mediaDevices.getUserMedia({ video: true });
                });
                video.srcObject = stream;
            } catch (err) {
                document.getElementById('responseBox').innerText = "Camera permission needed. Please allow camera access.";
            }
        }

        // Scan Action
        function scanMedicine() {
            let scanMsgEn = "Scanning strip... Found Paracetamol 650mg. Dosage: 1 tablet after food.";
            let scanMsgTa = "மருந்து ஸ்கேன் செய்யப்பட்டது: பாராசிட்டமால் 650mg. அளவு: உணவுக்குப் பின் 1 மாத்திரை.";

            let msg = currentLang === 'ta-IN' ? scanMsgTa : scanMsgEn;
            speak(msg);
        }

        function triggerSOS() {
            let alertTa = "அவசர உதவி! கேர்கேவருக்கு எச்சரிக்கை செய்தி அனுப்பப்பட்டது.";
            let alertEn = "SOS Alert triggered! Notified Caregiver urgently.";
            speak(currentLang === 'ta-IN' ? alertTa : alertEn);
        }

        function toggleRole() {
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('appDashboard').style.display = 'none';
            speak("Switched to login screen. Choose Patient or Caregiver.");
        }

        // Continuous Intelligent Listening with Auto Language Detector
        function startContinuousListening() {
            if (!recognition) return;

            recognition.onresult = (e) => {
                const speechText = e.results[e.results.length - 1][0].transcript;
                const textLower = speechText.toLowerCase();

                // Detect Language automatically from spoken text
                if (isTamilText(speechText) || textLower.includes('தமிழ்')) {
                    currentLang = 'ta-IN';
                } else {
                    currentLang = 'en-US';
                }

                document.getElementById('aiStatus').innerText = "Heard: " + speechText;

                if (textLower.includes('scan') || textLower.includes('ஸ்கேன்')) {
                    scanMedicine();
                } else if (textLower.includes('sos') || textLower.includes('help') || textLower.includes('காப்பாத்து')) {
                    triggerSOS();
                } else {
                    if (currentLang === 'ta-IN') {
                        speak("உங்கள் கேள்வி கேட்கப்பட்டது. மருந்தை ஸ்கேன் செய்ய 'Scan' என்று சொல்லுங்கள்.");
                    } else {
                        speak("I heard you. Say 'Scan' to scan medicine strip or 'SOS' for emergency.");
                    }
                }
            };

            recognition.onend = () => {
                try { recognition.start(); } catch(e){}
            };

            try { recognition.start(); } catch(e){}
        }

        function listenCommand() {
            try { recognition.start(); } catch(e){}
            document.getElementById('aiStatus').innerText = "Listening now...";
        }
    </script>
</body>
</html>
