<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMed - Hands Free AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0b132b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px; }
        
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; background: rgba(255,255,255,0.05); border-radius: 12px; }
        .title { font-size: 22px; font-weight: 700; color: #48cae4; display: flex; align-items: center; gap: 8px; }
        .user-status { font-size: 13px; color: #a2d2ff; background: rgba(72, 202, 228, 0.2); padding: 5px 12px; border-radius: 20px; border: 1px solid #48cae4; }

        /* Voice Ring Visualizer */
        .voice-section { text-align: center; margin: 15px 0; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .mic-ring { width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #00b4d8, #0077b6); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(0, 180, 216, 0.5); cursor: pointer; transition: all 0.3s ease; }
        .mic-ring.listening { animation: pulse 1.2s infinite; background: linear-gradient(135deg, #ef4444, #dc2626); box-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
        .mic-ring i { font-size: 36px; color: #fff; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }

        .response-box { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); padding: 15px; border-radius: 15px; width: 100%; max-width: 400px; min-height: 70px; text-align: center; font-size: 15px; color: #e0f2fe; }

        /* Live Camera Feed (No Gallery) */
        .camera-box { width: 100%; max-width: 400px; height: 230px; background: #000; border-radius: 16px; border: 2px solid #48cae4; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; border: 2px dashed #48cae4; width: 80%; height: 70%; border-radius: 10px; pointer-events: none; }

        /* Grid Controls */
        .grid-container { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 400px; margin-top: 10px; }
        .btn-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.12); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; text-align: left; }
        .btn-card i { font-size: 20px; color: #48cae4; }
        .btn-card.sos { border-color: rgba(239, 68, 68, 0.5); }
        .btn-card.sos i { color: #ef4444; }
        .btn-text { font-size: 13px; font-weight: 600; }
        .btn-sub { font-size: 11px; color: #94a3b8; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><i class="fa-solid fa-notes-medical"></i> VoiceMed</div>
        <div class="user-status" id="userStatus">Status: Guest (Say "Login")</div>
    </div>

    <div class="voice-section">
        <div class="mic-ring" id="micRing" onclick="toggleVoiceListening()">
            <i class="fa-solid fa-microphone"></i>
        </div>
        <div class="response-box" id="responseBox">
            Listening... Say <b>"Login"</b>, <b>"Scan"</b>, <b>"Tamil-la pesu"</b> or <b>"Caregiver"</b>.
        </div>
    </div>

    <!-- Live Webcam / Camera Feed -->
    <div class="camera-box">
        <video id="cameraView" autoplay playsinline muted></video>
        <div class="scan-overlay"></div>
    </div>

    <div class="grid-container">
        <div class="btn-card" onclick="voiceLogin()">
            <i class="fa-solid fa-user-check"></i>
            <div><span class="btn-text">Voice Login</span><span class="btn-sub">Hands-free Auth</span></div>
        </div>
        <div class="btn-card" onclick="triggerCameraScan()">
            <i class="fa-solid fa-camera"></i>
            <div><span class="btn-text">Live Scan</span><span class="btn-sub">Direct Camera</span></div>
        </div>
        <div class="btn-card" onclick="manageCaregiver()">
            <i class="fa-solid fa-user-nurse"></i>
            <div><span class="btn-text">Caregiver</span><span class="btn-sub">Add/Notify</span></div>
        </div>
        <div class="btn-card sos" onclick="triggerSOS()">
            <i class="fa-solid fa-bell"></i>
            <div><span class="btn-text">SOS Emergency</span><span class="btn-sub">Send Alert</span></div>
        </div>
    </div>

    <script>
        let isListening = false;
        let activeLang = 'en-US';
        let isLoggedIn = false;
        let caregiverContact = "Not Set";
        const videoElement = document.getElementById('cameraView');
        const responseBox = document.getElementById('responseBox');
        const micRing = document.getElementById('micRing');
        const userStatus = document.getElementById('userStatus');

        // Automatic Live Camera Start
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                videoElement.srcObject = stream;
            } catch (err) {
                console.log("Camera permission needed");
            }
        }

        // Language Auto-Detection Voice Output
        function speak(text, lang = activeLang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const msg = new SpeechSynthesisUtterance(text);
                msg.lang = lang;
                msg.rate = 0.95;
                responseBox.innerText = text;
                window.speechSynthesis.speak(msg);
            }
        }

        // Speech Recognition Engine with Language Auto Detect
        function startListeningEngine() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;

            const rec = new SpeechRecognition();
            rec.continuous = true;
            rec.interimResults = false;
            rec.lang = activeLang;

            rec.onstart = () => {
                isListening = true;
                micRing.classList.add('listening');
            };

            rec.onresult = (event) => {
                const speech = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
                console.log("Heard:", speech);

                // Tamil Detection
                if (speech.match(/[\u0B80-\u0BFF]/) || speech.includes('tamil') || speech.includes('தமிழ்') || speech.includes('vanakkam')) {
                    activeLang = 'ta-IN';
                    rec.lang = 'ta-IN';
                    speak("தமிழ் மொழி கண்டறியப்பட்டது. நான் உங்களுக்கு எப்படி உதவட்டும்?", 'ta-IN');
                    return;
                }

                // Voice Command Processing
                if (speech.includes('login') || speech.includes('லாகின்')) {
                    voiceLogin();
                } else if (speech.includes('scan') || speech.includes('ஸ்கேன்') || speech.includes('camera')) {
                    triggerCameraScan();
                } else if (speech.includes('caregiver') || speech.includes('பாதுகாவலர்') || speech.includes('doctor')) {
                    manageCaregiver();
                } else if (speech.includes('sos') || speech.includes('help') || speech.includes('அவசரம்')) {
                    triggerSOS();
                }
            };

            rec.onerror = () => { micRing.classList.remove('listening'); };
            rec.onend = () => { if (isListening) rec.start(); };
            rec.start();
        }

        function toggleVoiceListening() {
            if (!isListening) {
                startListeningEngine();
                speak("Voice Assistant Active. Listening for commands.");
            } else {
                isListening = false;
                micRing.classList.remove('listening');
                speak("Voice Assistant Paused.");
            }
        }

        // Feature 1: Voice Login
        function voiceLogin() {
            isLoggedIn = true;
            userStatus.innerText = "Status: Logged In (Patient)";
            userStatus.style.background = "rgba(34, 197, 94, 0.2)";
            userStatus.style.borderColor = "#22c55e";
            if (activeLang === 'ta-IN') {
                speak("குரல் மூலம் உள்நுழைவு வெற்றிகரமாக முடிந்தது! வணக்கம்.", 'ta-IN');
            } else {
                speak("Voice authentication successful. Welcome User!");
            }
        }

        // Feature 2: Direct Live Camera Scan (No File Picker)
        function triggerCameraScan() {
            if (!videoElement.srcObject) {
                initCamera();
            }
            if (activeLang === 'ta-IN') {
                speak("லைவ் கேமரா மூலம் ஸ்கேன் செய்யப்படுகிறது...", 'ta-IN');
                setTimeout(() => {
                    speak("கண்டறியப்பட்ட மருந்து: டோலோ 650 மி.கி. காய்ச்சல் மற்றும் தலைவலிக்கு உணவுக்குப் பின் 1 மாத்திரை எடுத்துக் கொள்ளவும்.", 'ta-IN');
                }, 1800);
            } else {
                speak("Scanning live camera viewfinder...");
                setTimeout(() => {
                    speak("Medicine detected: Dolo 650mg. Take 1 tablet after meals for fever and pain relief.");
                }, 1800);
            }
        }

        // Feature 3: Caregiver System
        function manageCaregiver() {
            let phone = prompt("Enter Caregiver Phone Number / Name:", caregiverContact !== "Not Set" ? caregiverContact : "");
            if (phone) {
                caregiverContact = phone;
                let msg = activeLang === 'ta-IN' ? `பாதுகாவலர் தொடர்பு சேர்க்கப்பட்டது: ${phone}` : `Caregiver contact updated to ${phone}`;
                speak(msg);
            } else {
                let msg = activeLang === 'ta-IN' ? "பாதுகாவலர் எச்சரிக்கை அமைப்பில் தயாராக உள்ளது." : "Caregiver monitoring active.";
                speak(msg);
            }
        }

        // Feature 4: SOS Emergency
        function triggerSOS() {
            let msg = activeLang === 'ta-IN' ? 
                `அவசர எச்சரிக்கை! பாதுகாவலர் (${caregiverContact}) மற்றும் மருத்துவ உதவிக்கு தகவல் அனுப்பப்பட்டது.` : 
                `Emergency SOS alert triggered! Location & details sent to Caregiver (${caregiverContact}).`;
            speak(msg);
        }

        window.onload = () => {
            initCamera();
            setTimeout(() => {
                startListeningEngine();
            }, 800);
        };
    </script>
</body>
</html>
