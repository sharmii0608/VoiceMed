<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMed - Live Scanner AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f172a; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 15px; }
        .header { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px; }
        .title { font-size: 22px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        .lang-badge { background: rgba(56, 189, 248, 0.2); border: 1px solid #38bdf8; color: #38bdf8; padding: 4px 10px; border-radius: 20px; font-size: 13px; }
        
        .status-container { text-align: center; width: 100%; max-width: 400px; margin-top: 10px; }
        .status-indicator { font-size: 13px; color: #94a3b8; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; }
        .status-dot.active { background-color: #22c55e; box-shadow: 0 0 8px #22c55e; }

        .response-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 14px; min-height: 80px; text-align: center; font-size: 16px; color: #e2e8f0; }

        /* Camera Viewport */
        .camera-container { width: 100%; max-width: 380px; height: 240px; background: #000; border-radius: 20px; border: 2px solid #38bdf8; overflow: hidden; position: relative; margin: 15px 0; display: flex; justify-content: center; align-items: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .scan-overlay { position: absolute; border: 2px dashed #38bdf8; width: 80%; height: 70%; border-radius: 12px; pointer-events: none; }

        .scanner-btn { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #2563eb); border: none; display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 0 20px rgba(2, 132, 199, 0.6); position: absolute; bottom: 10px; }
        .scanner-btn i { font-size: 28px; color: #fff; }

        .controls-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; max-width: 380px; }
        .control-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 10px; cursor: pointer; }
        .control-card i { font-size: 20px; color: #38bdf8; }
        .control-card.sos { border-color: rgba(239, 68, 68, 0.4); }
        .control-card.sos i { color: #ef4444; }
        .card-title { font-size: 13px; font-weight: 600; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="title"><i class="fa-solid fa-notes-medical"></i> VoiceMed</div>
        <div class="lang-badge" id="langBadge">Language: EN</div>
    </div>

    <div class="status-container">
        <div class="status-indicator">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">AI Voice Active...</span>
        </div>
        <div class="response-card" id="responseBox">
            Welcome! Say "Scan", "Tamil", or "SOS".
        </div>
    </div>

    <!-- Live Camera Feed Box -->
    <div class="camera-container">
        <video id="webcam" autoplay playsinline></video>
        <div class="scan-overlay"></div>
        <button class="scanner-btn" onclick="captureAndScan()">
            <i class="fa-solid fa-camera"></i>
        </button>
    </div>

    <div class="controls-grid">
        <div class="control-card" onclick="startCamera()">
            <i class="fa-solid fa-video"></i>
            <span class="card-title">Start Camera</span>
        </div>
        <div class="control-card" onclick="toggleLanguage()">
            <i class="fa-solid fa-language"></i>
            <span class="card-title">Tamil / English</span>
        </div>
        <div class="control-card sos" onclick="triggerSOS()">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span class="card-title">SOS Alert</span>
        </div>
        <div class="control-card" onclick="captureAndScan()">
            <i class="fa-solid fa-qrcode"></i>
            <span class="card-title">Scan Strip</span>
        </div>
    </div>

    <script>
        let currentLang = 'en-US';
        const video = document.getElementById('webcam');
        const responseBox = document.getElementById('responseBox');
        const statusDot = document.getElementById('statusDot');

        // Start Real Camera Feed
        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
                video.srcObject = stream;
                speak(currentLang === 'ta-IN' ? "கேமரா நேரலையில் உள்ளது." : "Camera feed active. Show medicine strip.");
            } catch (err) {
                speak("Please allow camera permission in your browser.");
            }
        }

        // Capture & Simulated OCR Scan
        function captureAndScan() {
            if (!video.srcObject) {
                startCamera();
                return;
            }
            speak(currentLang === 'ta-IN' ? "ஸ்கேன் செய்யப்படுகிறது..." : "Scanning medicine strip...", () => {
                setTimeout(() => {
                    let resultText = currentLang === 'ta-IN' ? 
                        "மருந்து: டோலோ 650. அளவு: உணவுக்குப் பின் 1 மாத்திரை. காலாவதி: டிசம்பர் 2027. பாதுகாப்பானது." : 
                        "Medicine detected: Dolo 650. Dosage: 1 tablet after meals. Expiry: Dec 2027. Status: Safe to use.";
                    speak(resultText);
                }, 1000);
            });
        }

        function speak(text, callback) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                statusDot.classList.add('active');
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = currentLang;
                utterance.rate = 0.9;
                utterance.onend = () => {
                    statusDot.classList.remove('active');
                    if (callback) callback();
                    listenVoice();
                };
                responseBox.innerText = text;
                window.speechSynthesis.speak(utterance);
            }
        }

        function listenVoice() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return;
            const rec = new SpeechRecognition();
            rec.lang = currentLang;
            rec.onresult = (e) => {
                const cmd = e.results[0][0].transcript.toLowerCase();
                if (cmd.includes('scan') || cmd.includes('ஸ்கேன்')) captureAndScan();
                else if (cmd.includes('tamil') || cmd.includes('தமிழ்')) { currentLang = 'ta-IN'; speak("தமிழ் மாற்றப்பட்டது."); }
                else if (cmd.includes('sos') || cmd.includes('help')) triggerSOS();
            };
            try { rec.start(); } catch(e){}
        }

        function toggleLanguage() {
            currentLang = currentLang === 'en-US' ? 'ta-IN' : 'en-US';
            document.getElementById('langBadge').innerText = currentLang === 'ta-IN' ? "Language: TA" : "Language: EN";
            speak(currentLang === 'ta-IN' ? "தமிழ் மொழி தேர்ந்தெடுக்கப்பட்டது." : "Switched to English.");
        }

        function triggerSOS() {
            speak(currentLang === 'ta-IN' ? "அவசர உதவி எச்சரிக்கை பராமரிப்பாளருக்கு அனுப்பப்பட்டது!" : "Emergency SOS notification sent to caregiver!");
        }

        window.onload = () => {
            setTimeout(() => {
                speak("Welcome to VoiceMed. Starting camera.");
                startCamera();
            }, 500);
        };
    </script>
</body>
</html>
