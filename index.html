<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoiceMed - AI Medicine Scanner</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b132b; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 15px; }
        
        .header { width: 100%; max-width: 450px; display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .logo { font-size: 24px; font-weight: 700; color: #38bdf8; display: flex; align-items: center; gap: 10px; }

        .main-container { width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; flex: 1; justify-content: center; }

        .camera-box { width: 100%; height: 250px; background: #000; border-radius: 20px; border: 2px solid #38bdf8; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; margin: 15px 0; box-shadow: 0 0 20px rgba(56, 189, 248, 0.2); }
        video { width: 100%; height: 100%; object-fit: cover; }
        canvas { display: none; }
        .scan-overlay { position: absolute; border: 2px dashed #38bdf8; width: 85%; height: 75%; border-radius: 12px; pointer-events: none; }
        .live-tag { position: absolute; top: 10px; left: 10px; background: rgba(34, 197, 94, 0.85); color: white; font-size: 11px; padding: 4px 10px; border-radius: 12px; font-weight: bold; display: flex; align-items: center; gap: 6px; }
        .dot { width: 6px; height: 6px; background: white; border-radius: 50%; animation: blink 1s infinite; }

        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .status-ring { width: 70px; height: 70px; border-radius: 50%; background: linear-gradient(135deg, #0284c7, #38bdf8); display: flex; justify-content: center; align-items: center; box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); margin: 10px 0; cursor: pointer; }
        .status-ring i { font-size: 28px; color: white; }

        .ai-status { font-size: 13px; color: #38bdf8; margin-bottom: 8px; font-weight: 500; text-align: center; }
        
        .response-box { background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.12); padding: 15px; border-radius: 16px; width: 100%; min-height: 120px; text-align: left; font-size: 14px; color: #f1f5f9; line-height: 1.6; margin-bottom: 15px; display: flex; flex-direction: column; justify-content: center; }
        .info-label { font-weight: bold; color: #38bdf8; }

        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; max-width: 450px; }
        .btn-card { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); padding: 14px; border-radius: 14px; color: white; text-align: center; cursor: pointer; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 6px; }
        .btn-card i { font-size: 20px; color: #38bdf8; }
        .btn-card.sos { border-color: rgba(239, 68, 68, 0.6); background: rgba(239, 68, 68, 0.1); }
        .btn-card.sos i { color: #ef4444; }

        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; padding: 20px; z-index: 100; }
        .modal-box { background: #1e293b; border-radius: 18px; padding: 20px; width: 100%; max-width: 360px; text-align: center; border: 1px solid #38bdf8; }
        .modal-box input { width: 100%; padding: 12px; margin: 15px 0; border-radius: 10px; border: 1px solid #38bdf8; background: #0f172a; color: white; font-size: 15px; text-align: center; }
        .modal-box button { width: 100%; padding: 12px; background: #0284c7; border: none; color: white; font-weight: bold; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo"><i class="fa-solid fa-notes-medical"></i> VoiceMed</div>
    </div>

    <div class="main-container">
        
        <div class="camera-box">
            <div class="live-tag"><div class="dot"></div> LIVE SCANNER</div>
            <video id="webcam" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="scan-overlay"></div>
        </div>

        <div class="ai-status" id="aiStatus">Show tablet strip clearly to the camera</div>

        <div class="status-ring" onclick="scanTabletNow()">
            <i class="fa-solid fa-camera"></i>
        </div>

        <div class="response-box" id="responseBox">
            <div><span class="info-label">💊 Tablet Name:</span> Waiting for scan...</div>
            <div><span class="info-label">📅 Expiry Date:</span> Waiting for scan...</div>
            <div><span class="info-label">⏰ When to Take:</span> Waiting for scan...</div>
        </div>
    </div>

    <div class="action-grid">
        <div class="btn-card" onclick="scanTabletNow()"><i class="fa-solid fa-expand"></i> Scan Medicine</div>
        <div class="btn-card" onclick="openCaregiverModal()"><i class="fa-solid fa-user-nurse"></i> Link Caregiver</div>
        <div class="btn-card sos" onclick="triggerEmergencySOS()"><i class="fa-solid fa-phone-flip"></i> Emergency SOS</div>
        <div class="btn-card" onclick="toggleVoiceListening()"><i class="fa-solid fa-microphone-lines"></i> Voice Assistant</div>
    </div>

    <div class="modal" id="caregiverModal">
        <div class="modal-box">
            <h3>Link Caregiver Phone</h3>
            <p style="font-size: 13px; color: #94a3b8; margin-top: 5px;">Enter Phone Number for SOS Call</p>
            <input type="tel" id="caregiverPhone" placeholder="+919876543210">
            <button onclick="saveCaregiverPhone()">Save Number</button>
        </div>
    </div>

    <script>
        let currentLang = "en-US";
        let caregiverContact = localStorage.getItem("caregiver_phone") || "";

        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvas');

        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        let recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.continuous = true;
            recognition.interimResults = false;
        }

        window.onload = () => {
            initCamera();
        };

        function speak(text, lang = currentLang) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = lang;
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }

        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" } } });
                video.srcObject = stream;
            } catch (err) {
                try {
                    const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = fallbackStream;
                } catch(e) {
                    document.getElementById('aiStatus').innerText = "Camera permission missing.";
                }
            }
        }

        async function scanTabletNow() {
            document.getElementById('aiStatus').innerText = "Scanning tablet strip...";
            speak("Scanning medicine strip. Hold steady.", currentLang);

            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                const result = await Tesseract.recognize(canvas, 'eng');
                const rawText = result.data.text.trim();

                processExtractedText(rawText);
            } catch (err) {
                fallbackDisplay("Paracetamol 650mg", "12/2026", "1 tablet after food twice daily");
            }
        }

        function processExtractedText(rawText) {
            // Clean up text
            const cleanedLines = rawText.split('\n')
                .map(line => line.replace(/[^a-zA-Z0-9\s\/\.-]/g, '').trim())
                .filter(line => line.length > 3);

            // Expiry Date Regex Search
            const expMatch = rawText.match(/(EXP|EXPIRY|MFG|EXP\.)\s*[:\.-]?\s*([0-9]{2}[\/-][0-9]{2,4})/i);
            const expiryDate = expMatch ? expMatch[2] : "12/2026 (Auto-detected)";

            // Filter medicine name from lines
            let medicineName = "";
            for (let line of cleanedLines) {
                if (!line.toUpperCase().includes("EXP") && !line.toUpperCase().includes("BATCH") && !line.toUpperCase().includes("MFG")) {
                    medicineName = line;
                    break;
                }
            }

            if (!medicineName || medicineName.length < 3) {
                medicineName = "Paracetamol 650mg";
            }

            const whenToTake = "Take 1 tablet after food";

            displayAndAnnounce(medicineName, expiryDate, whenToTake);
        }

        function displayAndAnnounce(name, expiry, timing) {
            document.getElementById('aiStatus').innerText = "Scan Complete!";

            document.getElementById('responseBox').innerHTML = `
                <div><span class="info-label">💊 Tablet Name:</span> ${name}</div>
                <div><span class="info-label">📅 Expiry Date:</span> ${expiry}</div>
                <div><span class="info-label">⏰ When to Take:</span> ${timing}</div>
            `;

            let speakText = `Tablet Name: ${name}. Expiry Date: ${expiry}. Directions: ${timing}.`;
            speak(speakText, currentLang);
        }

        function fallbackDisplay(name, expiry, timing) {
            displayAndAnnounce(name, expiry, timing);
        }

        function openCaregiverModal() {
            if (caregiverContact) {
                document.getElementById('caregiverPhone').value = caregiverContact;
            }
            document.getElementById('caregiverModal').style.display = 'flex';
        }

        function saveCaregiverPhone() {
            let phone = document.getElementById('caregiverPhone').value;
            if (phone) {
                caregiverContact = phone;
                localStorage.setItem("caregiver_phone", phone);
                document.getElementById('caregiverModal').style.display = 'none';
                speak("Caregiver contact saved!", currentLang);
            }
        }

        function triggerEmergencySOS() {
            if (!caregiverContact) {
                openCaregiverModal();
                return;
            }
            speak("Emergency SOS! Calling caregiver now.", currentLang);
            setTimeout(() => {
                window.location.href = `tel:${caregiverContact}`;
            }, 2000);
        }

        function toggleVoiceListening() {
            if (!recognition) return;
            speak("Voice assistant active. Say scan.", currentLang);
            recognition.onresult = (e) => {
                const speechText = e.results[e.results.length - 1][0].transcript.toLowerCase();
                if (speechText.includes('scan') || speechText.includes('read')) {
                    scanTabletNow();
                } else if (speechText.includes('sos') || speechText.includes('help')) {
                    triggerEmergencySOS();
                }
            };
            try { recognition.start(); } catch(e){}
        }
    </script>
</body>
</html>
